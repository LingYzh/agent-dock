<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Agent Dock · 子代理</title>
        <style>:root {
    color-scheme: light dark;
    --bg: #fff;
    --rail: #f9f9f9;
    --hover: #f0f0f0;
    --selected: #eaeaea;
    --line: #e8e8e8;
    --text: #242424;
    --muted: #777;
    --green: #26804b;
    --red: #b94242;
    --blue: #3975b9;
    --user: #f4f4f4;
    font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
}
@media (prefers-color-scheme: dark) {
    :root {
        --bg: #212121;
        --rail: #191919;
        --hover: #2b2b2b;
        --selected: #343434;
        --line: #353535;
        --text: #ededed;
        --muted: #a0a0a0;
        --green: #86c49a;
        --red: #e89797;
        --blue: #92b9e6;
        --user: #303030;
    }
}
:root[data-theme="light"] {
    color-scheme: light;
    --bg: #fff;
    --rail: #f9f9f9;
    --hover: #f0f0f0;
    --selected: #eaeaea;
    --line: #e8e8e8;
    --text: #242424;
    --muted: #777;
    --green: #26804b;
    --red: #b94242;
    --blue: #3975b9;
    --user: #f4f4f4;
}
:root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #212121;
    --rail: #191919;
    --hover: #2b2b2b;
    --selected: #343434;
    --line: #353535;
    --text: #ededed;
    --muted: #a0a0a0;
    --green: #86c49a;
    --red: #e89797;
    --blue: #92b9e6;
    --user: #303030;
}
* {
    box-sizing: border-box;
}
.status-message {
    position: fixed;
    z-index: 40;
    top: 60px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 8px;
    width: max-content;
    max-width: calc(100% - 32px);
    padding: 8px 10px 8px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    box-shadow: 0 4px 16px #0002;
    font-size: 12px;
}
.status-message > .ui-icon {
    color: var(--green);
}
.status-message .icon-button {
    flex-shrink: 0;
    width: 24px;
    height: 24px;
}
/* Keep scroll regions quiet in both host themes with a consistent thumb */
* {
    scrollbar-width: thin;
    scrollbar-color: color-mix(in srgb, var(--muted) 35%, transparent) transparent;
}
@supports selector(::-webkit-scrollbar) {
    * {
        scrollbar-width: auto;
        scrollbar-color: auto;
    }
    ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
    }
    ::-webkit-scrollbar-track,
    ::-webkit-scrollbar-corner {
        background: transparent;
    }
    ::-webkit-scrollbar-thumb {
        border: 1px solid transparent;
        border-radius: 999px;
        background: color-mix(in srgb, var(--muted) 35%, transparent);
        background-clip: padding-box;
    }
    ::-webkit-scrollbar-thumb:hover {
        background-color: color-mix(in srgb, var(--muted) 60%, transparent);
    }
    ::-webkit-scrollbar-button {
        display: none;
        width: 0;
        height: 0;
    }
}
@media (forced-colors: active) {
    * {
        scrollbar-color: auto;
    }
    ::-webkit-scrollbar-thumb {
        background-color: ButtonText;
    }
}
html,
body {
    height: 100%;
    margin: 0;
    overflow: hidden;
}
body {
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
}
h1,
h2,
h3,
h4,
p {
    margin: 0;
}
button,
input,
textarea,
select {
    font: inherit;
    color: inherit;
}
button {
    cursor: pointer;
    border: 0;
    background: transparent;
    border-radius: 6px;
}
button:not(:disabled):hover {
    background: var(--hover);
}
button:disabled {
    opacity: 0.35;
    cursor: not-allowed;
}
button:focus-visible,
input:focus-visible,
textarea:focus-visible,
summary:focus-visible {
    outline: 2px solid var(--blue);
    outline-offset: 2px;
}
[hidden] {
    display: none !important;
}
.app-header {
    height: 48px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    border-bottom: 1px solid var(--line);
}
.app-title,
.header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
}
h1 {
    font-size: 13px;
    font-weight: 600;
}
.branch-icon {
    display: inline-flex;
    align-items: center;
    color: var(--muted);
}
.ui-icon {
    display: block;
    width: 16px;
    height: 16px;
    flex-shrink: 0;
}
.count {
    min-width: 20px;
    padding: 0 4px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-size: 11px;
    text-align: center;
    color: var(--muted);
    line-height: 18px;
}
.connection {
    color: var(--muted);
    font-size: 11px;
}
.icon-button {
    width: 28px;
    height: 28px;
    display: inline-grid;
    place-items: center;
    border-radius: 6px;
}
.workspace {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 216px minmax(0, 1fr);
    grid-template-rows: minmax(0, 1fr);
    overflow: hidden;
}
.sidebar {
    background: var(--rail);
    display: flex;
    flex-direction: column;
    min-height: 0;
    border-right: 1px solid var(--line);
    padding: 12px 8px;
}
.sidebar-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: var(--muted);
    font-size: 11px;
    font-weight: 500;
    padding: 0 4px 6px;
}
input[type="search"] {
    width: 100%;
    padding: 6px 8px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--bg);
    font-size: 12px;
}
.filters {
    display: flex;
    gap: 4px;
    padding: 8px 0 6px;
}
.filters button {
    padding: 4px 8px;
    font-size: 11px;
    color: var(--muted);
    border-radius: 6px;
}
.filters button[aria-pressed="true"] {
    background: var(--selected);
    color: var(--text);
}
nav {
    overflow: auto;
    flex: 1;
    min-height: 0;
    overscroll-behavior: contain;
}
.agent-row {
    /* Keep the absolutely positioned accessible status inside the scroll list. */
    position: relative;
    display: grid;
    grid-template-columns: 8px minmax(0, 1fr);
    gap: 8px;
    align-items: center;
    text-align: left;
    width: 100%;
    height: 34px;
    padding: 0 8px;
    margin: 2px 0;
    border-radius: 6px;
}
.agent-row[aria-current="true"] {
    background: var(--selected);
}
.status-dot {
    display: inline-block;
    flex-shrink: 0;
    height: 7px;
    width: 7px;
    border-radius: 999px;
    background: var(--muted);
}
.status-dot:is([data-status="running"], [data-status="starting"], [data-status="configuring"], [data-status="cancelling"]) {
    background: #d4a125;
    animation: status-pulse 1.5s ease-in-out infinite;
}
.status-dot[data-status="blocked"] {
    background: #d4a125;
}
@keyframes status-pulse {
    50% {
        opacity: 0.25;
    }
}
@media (prefers-reduced-motion: reduce) {
    .status-dot {
        animation: none !important;
    }
}
.status-dot[data-status="completed"] {
    background: var(--green);
}
.status-dot[data-status="error"] {
    background: var(--red);
}
.agent-name {
    display: block;
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-weight: 500;
}
.agent-caption {
    display: block;
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
}
.sidebar-footer {
    padding: 8px 4px 0;
    font-size: 11px;
    color: var(--muted);
    border-top: 1px solid var(--line);
    margin-top: 8px;
}
.sidebar-footer span {
    display: block;
    margin-top: 2px;
}
.agent-pane {
    display: flex;
    flex-direction: column;
    min-height: 0;
    min-width: 0;
}
.agent-header {
    padding: 12px 20px 8px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
}
.agent-header .header-actions {
    flex-shrink: 0;
}
#archive {
    white-space: nowrap;
    font-size: 11px;
    padding: 4px 8px;
}
h2 {
    font-size: 14px;
    line-height: 1.4;
    font-weight: 600;
    overflow-wrap: anywhere;
}
#agent-meta {
    color: var(--muted);
    font-size: 11px;
    margin-top: 2px;
}
.badge {
    flex-shrink: 0;
    font-size: 10px;
    padding: 3px 6px;
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--muted);
}
.badge[data-status="completed"] {
    color: var(--green);
}
.badge[data-status="running"] {
    color: var(--blue);
}
.detail-tabs {
    display: flex;
    gap: 16px;
    padding: 0 20px;
    border-bottom: 1px solid var(--line);
}
.detail-tabs button {
    padding: 8px 0;
    border-radius: 0;
    font-size: 12px;
    color: var(--muted);
    border-bottom: 2px solid transparent;
}
.detail-tabs button[aria-pressed="true"] {
    color: var(--text);
    border-bottom-color: var(--text);
    font-weight: 500;
}
.usage-strip {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 16px;
    padding: 6px 20px;
    color: var(--muted);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    border-bottom: 1px solid var(--line);
    background: var(--rail);
}
.conversation,
.diagnostics,
.usage {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 20px;
    scrollbar-gutter: stable;
    overscroll-behavior: contain;
}
.conversation {
    overflow-anchor: none;
}
.timeline-window {
    position: relative;
    overflow: clip;
}
.timeline-row {
    position: absolute;
    inset-inline: 0;
    display: flow-root;
    min-height: 1px;
}
.detail-paging {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    padding: 6px 0;
    font-size: 11px;
}
.detail-page-status {
    color: var(--muted);
    overflow-wrap: anywhere;
}
.setup-worktree {
    font-size: 12px;
}
#setup-worktree-fields {
    display: grid;
    gap: 6px;
    margin-top: 8px;
}
#setup-repo {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 8px;
}
.history-control {
    display: flex;
    justify-content: center;
    margin: 0 0 16px;
    font-size: 12px;
    color: var(--muted);
}
.message {
    margin-bottom: 16px;
    max-width: 860px;
}
.message-label {
    color: var(--muted);
    font-size: 11px;
    margin-bottom: 4px;
}
.message-body {
    line-height: 1.6;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font-size: 13px;
}
.markdown {
    white-space: normal;
    overflow-wrap: anywhere;
    line-height: 1.6;
    min-width: 0;
    font-size: 13px;
}
.markdown > :first-child {
    margin-top: 0;
}
.markdown > :last-child {
    margin-bottom: 0;
}
.markdown p,
.markdown ul,
.markdown ol,
.markdown blockquote,
.markdown pre,
.markdown .markdown-table {
    margin: 0 0 10px;
}
.markdown h1,
.markdown h2,
.markdown h3,
.markdown h4,
.markdown h5,
.markdown h6 {
    margin: 16px 0 8px;
    line-height: 1.4;
    font-weight: 600;
}
.markdown h1 {
    font-size: 18px;
}
.markdown h2 {
    font-size: 15px;
}
.markdown h3 {
    font-size: 14px;
}
.markdown h4,
.markdown h5,
.markdown h6 {
    font-size: 13px;
}
.markdown ul,
.markdown ol {
    padding-left: 20px;
}
.markdown li {
    margin: 3px 0;
}
.markdown li > p {
    margin-bottom: 3px;
}
.markdown li > ul,
.markdown li > ol {
    margin-bottom: 3px;
}
.markdown blockquote {
    padding: 2px 0 2px 10px;
    border-left: 3px solid var(--line);
    color: var(--muted);
}
.markdown blockquote > :last-child {
    margin-bottom: 0;
}
.markdown code {
    font: 11px/1.6 ui-monospace, SFMono-Regular, Consolas, monospace;
    background: var(--selected);
    border-radius: 4px;
    padding: 2px 4px;
}
.markdown pre {
    background: var(--rail);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 10px 12px;
    overflow: auto;
    white-space: pre;
}
.markdown pre code {
    background: none;
    padding: 0;
    border-radius: 0;
    white-space: pre;
}
.markdown a {
    color: var(--blue);
    text-decoration: underline;
    text-underline-offset: 3px;
}
.markdown-table {
    max-width: 100%;
    overflow: auto;
}
.markdown table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
}
.markdown th,
.markdown td {
    padding: 6px 10px;
    border: 1px solid var(--line);
    text-align: left;
    vertical-align: top;
    min-width: 70px;
}
.markdown th {
    font-weight: 600;
    background: var(--rail);
}
.markdown hr {
    border: 0;
    border-top: 1px solid var(--line);
    margin: 16px 0;
}
.message.user .message-body {
    background: var(--user);
    border-radius: 8px;
    padding: 8px 12px;
    display: inline-block;
    max-width: 100%;
}
.message:not(.user):not(.assistant) {
    margin-bottom: 12px;
    padding: 6px 10px;
    background: var(--rail);
    border-radius: 6px;
    color: var(--muted);
    font-size: 11px;
}
.message:not(.user):not(.assistant) .message-label {
    display: none;
}
.message:not(.user):not(.assistant) .message-body {
    line-height: 1.5;
    font-size: 11px;
}
.turn-end {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--muted);
    font-size: 11px;
    margin: 0 0 16px;
}
.turn-end::before {
    content: "";
    height: 1px;
    width: 20px;
    background: var(--line);
}
.tool,
.tool-group {
    margin: 0 0 4px;
    min-width: 0;
}
.tool summary,
.tool-group > summary {
    cursor: pointer;
    padding: 3px 0;
    min-height: 28px;
    font-size: 12px;
    font-family: inherit;
    color: var(--muted);
    border-radius: 4px;
}
.tool summary:hover,
.tool-group > summary:hover {
    background: var(--hover);
    color: var(--text);
}
.tool pre {
    margin: 4px 0 8px 22px;
    padding: 8px 10px;
    background: var(--rail);
    border-left: 1px solid var(--line);
    max-height: 280px;
    overflow: auto;
    font: 11px/1.6 ui-monospace, SFMono-Regular, Consolas, monospace;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}
.thought {
    margin: 0 0 8px;
}
.thought summary {
    cursor: pointer;
    padding: 3px 0;
    min-height: 28px;
    font-size: 12px;
    font-family: inherit;
    color: var(--muted);
}
.thought summary:hover {
    color: var(--text);
}
.thought-body {
    overflow-wrap: anywhere;
    line-height: 1.6;
    padding: 4px 0 8px 12px;
    border-left: 1px solid var(--line);
    font-size: 12px;
    color: var(--muted);
}
.thought > summary,
.tool > summary,
.tool-group > summary {
    display: flex;
    align-items: center;
    gap: 6px;
    list-style: none;
}
.thought > summary::-webkit-details-marker,
.tool > summary::-webkit-details-marker,
.tool-group > summary::-webkit-details-marker {
    display: none;
}
details > summary [data-disclosure] {
    transform: rotate(-90deg);
}
details[open] > summary [data-disclosure] {
    transform: rotate(0deg);
}
.tool-group-items {
    padding: 2px 0 4px 12px;
}
.tool-group-items .tool {
    margin-bottom: 0;
}
.tool-group-items .tool:last-child {
    margin-bottom: 0;
}
.disclosure-label {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.tool > summary .disclosure-label {
    flex: 1;
}
.tool-group {
    margin-bottom: 10px;
}
.tool-group[data-status="failed"] > summary,
.tool[data-status="failed"] > summary {
    color: var(--red);
}
.markdown a:focus-visible {
    outline: 2px solid var(--blue);
    outline-offset: 2px;
    border-radius: 2px;
}
#error[data-scope="link-info"] {
    color: var(--text);
    background: var(--rail);
    user-select: text;
    overflow-wrap: anywhere;
}
.empty {
    padding: 36px 12px;
    text-align: center;
    color: var(--muted);
    line-height: 1.7;
}
.empty strong {
    display: block;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 4px;
}
.empty-list {
    color: var(--muted);
    padding: 16px 8px;
    font-size: 12px;
}
.composer {
    margin: 0 20px 16px;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 12px;
    background: var(--bg);
}
textarea {
    display: block;
    width: 100%;
    border: 0;
    resize: none;
    min-height: 44px;
    max-height: 160px;
    background: transparent;
    line-height: 1.6;
    font-size: 13px;
    overflow-y: auto;
    padding: 0;
}
textarea:focus {
    outline: 0;
}
.composer:focus-within {
    border-color: var(--muted);
}
.composer-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-top: 6px;
    flex-wrap: wrap;
}
.composer-actions {
    display: flex;
    align-items: center;
    flex-shrink: 0;
    gap: 6px;
    margin-left: auto;
}
.preview-toggle {
    padding: 4px 8px;
    font-size: 11px;
    color: var(--muted);
    border-radius: 6px;
}
.preview-toggle[aria-pressed="true"] {
    background: var(--selected);
    color: var(--text);
}
.prompt-preview {
    min-height: 44px;
    max-height: 160px;
    overflow: auto;
    padding: 2px;
    font-size: 13px;
}
#composer-hint {
    font-size: 11px;
    color: var(--muted);
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.primary,
.secondary {
    padding: 5px 10px;
    font-size: 12px;
    border-radius: 6px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
}
.primary {
    background: var(--text);
    color: var(--bg);
    border: 1px solid transparent;
}
.primary:not(:disabled):hover {
    background: color-mix(in srgb, var(--text) 85%, var(--bg));
    color: var(--bg);
}
.primary:not(:disabled):active {
    background: color-mix(in srgb, var(--text) 70%, var(--bg));
}
.primary:disabled {
    opacity: 0.35;
    cursor: not-allowed;
}
.secondary {
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--text);
}
.secondary:not(:disabled):hover {
    background: var(--hover);
}
.secondary:disabled {
    opacity: 0.35;
    cursor: not-allowed;
}
#send {
    width: 28px;
    height: 28px;
    padding: 0;
    border-radius: 6px;
    flex-shrink: 0;
    display: inline-grid;
    place-items: center;
}
#send .ui-icon {
    width: 15px;
    height: 15px;
}
#cancel {
    padding: 4px 8px;
    font-size: 11px;
}
.diagnostics dl {
    display: grid;
    grid-template-columns: 80px minmax(0, 1fr);
    gap: 8px 12px;
    margin: 0 0 20px;
    font-size: 12px;
}
.diagnostics dt {
    color: var(--muted);
}
.diagnostics dd {
    margin: 0;
    overflow-wrap: anywhere;
}
.diagnostics pre {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font-size: 11px;
    line-height: 1.6;
    background: var(--rail);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 10px;
}
.error-banner {
    padding: 8px 16px;
    color: var(--red);
    background: color-mix(in srgb, var(--red) 8%, var(--bg));
    border-bottom: 1px solid var(--line);
    font-size: 12px;
}
.closed-hint {
    flex-shrink: 0;
    margin: 0;
    padding: 12px 20px;
    font-size: 11px;
    color: var(--muted);
    border-top: 1px solid var(--line);
}
.option-check {
    display: inline-flex;
    align-items: center;
    visibility: hidden;
}
.permissions {
    flex-shrink: 0;
    max-height: 40%;
    overflow: auto;
    margin: 0 20px 12px;
    border: 1px solid #d4a12566;
    border-radius: 8px;
    background: color-mix(in srgb, #d4a125 5%, var(--bg));
}
.permission-card {
    padding: 12px;
    border-bottom: 1px solid var(--line);
}
.permission-card:last-child {
    border-bottom: 0;
}
.permission-card h3 {
    font-size: 12px;
    margin: 0 0 8px;
}
.permission-title {
    font-size: 12px;
    line-height: 1.6;
    overflow-wrap: anywhere;
}
.permission-card summary {
    cursor: pointer;
    font-size: 11px;
    padding: 8px 0;
    color: var(--muted);
}
.permission-card pre {
    max-height: 160px;
    overflow: auto;
    margin: 0 0 10px;
    padding: 8px 10px;
    background: var(--rail);
    border-radius: 6px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font: 11px/1.6 Consolas, monospace;
}
.permission-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 10px;
}
.permission-actions button {
    margin: 0;
    text-align: left;
}
.permission-card .usage-note {
    font-size: 11px;
    color: var(--muted);
}
.composition {
    margin: 12px 0;
}
.composition-bar {
    display: flex;
    width: 100%;
    height: 8px;
    overflow: hidden;
    border-radius: 999px;
    background: var(--line);
}
.composition-bar > span {
    display: block;
    height: 100%;
}
.composition-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 12px;
    margin-top: 8px;
}
.legend-entry {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
}
.legend-entry i {
    width: 6px;
    height: 6px;
    border-radius: 999px;
    flex-shrink: 0;
}
.usage h3 {
    font-size: 12px;
    font-weight: 600;
    margin: 0 0 12px;
}
.usage dl {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px 12px;
    margin: 0 0 20px;
    font-size: 12px;
}
.usage dt,
.usage p {
    color: var(--muted);
}
.usage dd {
    margin: 0;
    font-variant-numeric: tabular-nums;
}
.usage p {
    font-size: 11px;
    line-height: 1.6;
    margin: 6px 0 16px;
}
.usage progress {
    width: 100%;
    height: 6px;
    accent-color: var(--text);
}
.usage-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 16px;
}
.usage-section {
    border-bottom: 1px solid var(--line);
    padding: 0 0 18px;
    margin: 0 0 18px;
}
.usage-section:last-child {
    border-bottom: 0;
}
.usage .usage-note {
    margin: 6px 0 12px;
    font-size: 11px;
}
.usage-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
    margin-bottom: 8px;
}
.usage-card {
    min-width: 0;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
}
.usage-label {
    display: block;
    color: var(--muted);
    font-size: 11px;
    margin-bottom: 4px;
}
.usage-card strong {
    display: block;
    font-size: 15px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    overflow-wrap: anywhere;
}
.context-headline {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 8px;
}
.context-headline strong {
    font-size: 20px;
    font-weight: 500;
}
.context-headline span {
    color: var(--muted);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
}
.usage h4 {
    font-size: 12px;
    font-weight: 500;
    margin: 16px 0 8px;
}
.context-categories {
    display: grid;
    gap: 8px;
}
.category-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 4px 12px;
    font-size: 11px;
}
.category-row > span:last-of-type {
    color: var(--muted);
    font-variant-numeric: tabular-nums;
}
.category-row progress {
    grid-column: 1 / -1;
    height: 4px;
}
.usage-report {
    border: 1px solid var(--line);
    border-radius: 8px;
    margin: 8px 0;
    overflow: hidden;
}
.usage-report summary {
    cursor: pointer;
    padding: 8px 12px;
    font-size: 11px;
    color: var(--muted);
}
.usage-table {
    max-width: 100%;
    overflow: auto;
}
.usage-table table {
    width: 100%;
    border-collapse: collapse;
    font-size: 11px;
}
.usage-table th,
.usage-table td {
    text-align: left;
    padding: 6px 10px;
    border-bottom: 1px solid var(--line);
    overflow-wrap: anywhere;
    min-width: 70px;
}
.usage-table th {
    background: var(--rail);
    font-weight: 500;
}
.sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
}
.session-setup {
    width: min(440px, calc(100vw - 32px));
    max-height: calc(100vh - 32px));
    padding: 20px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--bg);
    color: var(--text);
    box-shadow: 0 16px 48px rgba(0, 0, 0, 0.25);
    overflow: auto;
}
.session-setup::backdrop {
    background: rgba(0, 0, 0, 0.5);
}
.setup-agent {
    display: block;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 6px;
}
.setup-heading h2 {
    font-size: 16px;
    font-weight: 600;
}
.setup-heading p {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.6;
    margin-top: 6px;
}
.setup-fields {
    display: grid;
    gap: 16px;
    margin: 20px 0 16px;
}
.setup-label {
    display: block;
    font-size: 12px;
    margin-bottom: 6px;
}
.setup-picker {
    position: relative;
}
.setup-trigger {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--rail);
    padding: 8px 10px;
    text-align: left;
    font-size: 12px;
}
.setup-trigger > span {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.setup-options {
    position: relative;
    width: 100%;
    margin-top: 4px;
    max-height: 200px;
    overflow: auto;
    padding: 4px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--rail);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
}
.setup-option {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    width: 100%;
    text-align: left;
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 12px;
}
.setup-option-copy {
    min-width: 0;
    overflow-wrap: anywhere;
    line-height: 1.5;
}
.setup-option-copy small {
    display: block;
    font-size: 10px;
    color: var(--muted);
    margin-top: 2px;
}
.setup-option[aria-selected="true"] {
    background: var(--selected);
}
.setup-option[aria-selected="true"] .option-check {
    visibility: visible;
}
.setup-status,
.setup-error,
.setup-note,
.setup-unavailable {
    font-size: 11px;
    line-height: 1.6;
    color: var(--muted);
}
.setup-status {
    margin-top: 16px;
}
.setup-error {
    margin-top: 12px;
    color: var(--red);
}
.setup-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 20px;
}
.setup-actions button {
    padding: 8px 12px;
}
/* Viewport width between 541px and 899px (e.g. 650px) */
@media (max-width: 899px) {
    .workspace {
        grid-template-columns: 180px minmax(0, 1fr);
    }
}
/* Viewport width <= 540px: column layout, session list <= 200px */
@media (max-width: 540px) {
    .workspace {
        grid-template-columns: 1fr;
        grid-template-rows: auto minmax(0, 1fr);
    }
    .sidebar {
        max-height: min(200px, 38dvh);
        border-right: 0;
        border-bottom: 1px solid var(--line);
        padding: 8px 10px;
        overflow: hidden;
    }
    .sidebar-footer {
        display: none;
    }
    .filters {
        padding: 6px 0 4px;
    }
    nav {
        min-height: 0;
        overflow-y: auto;
        flex: 1;
    }
    .agent-row {
        height: 32px;
        padding: 0 6px;
    }
    .agent-header {
        padding: 10px 12px 6px;
    }
    .detail-tabs {
        padding: 0 12px;
        gap: 12px;
    }
    .usage-strip {
        padding: 4px 12px;
    }
    .conversation,
    .diagnostics,
    .usage {
        padding: 12px;
    }
    .composer {
        margin: 0 12px 10px;
        padding: 6px 10px;
    }
    .connection {
        max-width: 100px;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
    }
}
/* 360px small screen adaptation */
@media (max-width: 380px) {
    .app-header {
        padding: 0 10px;
    }
    .app-title {
        gap: 6px;
    }
    .composer {
        margin: 0 8px 8px;
        padding: 6px 8px;
    }
    .composer-footer {
        gap: 4px;
    }
    #composer-hint {
        max-width: 130px;
    }
}
